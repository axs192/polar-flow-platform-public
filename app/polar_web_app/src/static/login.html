<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏃</text></svg>" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="login-main">
    <div class="login-card">
      <header>
        <h1>Sign in</h1>
        <p>Sign in to use the agent.</p>
      </header>

      <!--ERROR-->

      <form method="post" action="/auth/login">
        <input name="email" type="email" placeholder="Email" autocomplete="email" autofocus required />
        <input name="password" type="password" placeholder="Password" autocomplete="current-password" minlength="6" required />
        <button type="submit">Sign in</button>
      </form>
    </div>
  </main>
</body>
</html>
