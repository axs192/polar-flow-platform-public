[project]
name = "exercise-etl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3==1.42.57",
    "botocore==1.42.57",
    "fitparse",
    "isodate==0.7.2",
    "numpy==2.4.2",
    "pandas==3.0.1",
    "python-dotenv==1.2.2",
    "requests==2.33.0",
]

[dependency-groups]
dev = [
    "coverage",
    "moto",
    "responses",
]

[tool.uv]
package = false

[tool.coverage.run]
source = ["src"]
# Not part of the deployed Lambda image (see .dockerignore) - dev-only, so
# excluded from the coverage denominator rather than counted as untested.
omit = ["src/app/debug.py", "src/data/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
