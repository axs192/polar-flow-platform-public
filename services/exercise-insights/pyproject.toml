[project]
name = "exercise-insights"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.66,<2.0.0",
    "botocore>=1.42.64,<2.0.0",
    "numpy>=2.4.3,<3.0.0",
    "openai>=2.26.0,<3.0.0",
    "pandas>=3.0.1,<4.0.0",
    "python-dotenv>=0.9.9",
    "requests>=2.32.5,<3.0.0",
]

[dependency-groups]
dev = [
    "coverage",
    "moto",
    "responses",
    "respx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
source = ["exercise_insights"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 75
